<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mật Mã Đông Dương - Giải Mã Bức Tranh 3</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #111424;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }

      h1 {
        color: #ffcc00;
        margin-bottom: 5px;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-size: 24px;
      }

      p.subtitle {
        color: #aaa;
        font-size: 14px;
        margin-bottom: 15px;
      }

      /* ---- KHU VỰC NHẬP ĐÁP ÁN ĐOÁN ẢNH ---- */
      .guess-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.05);
        padding: 8px 15px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
      }

      .guess-input {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 14px;
        padding: 5px 10px;
        width: 250px;
        outline: none;
      }

      .guess-input::placeholder {
        color: #777;
      }

      .guess-btn {
        background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
        color: #111424;
        border: none;
        padding: 8px 20px;
        font-size: 13px;
        font-weight: bold;
        text-transform: uppercase;
        border-radius: 20px;
        cursor: pointer;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        transition: all 0.2s ease;
      }

      .guess-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(255, 153, 0, 0.4);
        filter: brightness(1.1);
      }

      /* Khung chứa lưới game cố định kích thước 600x480 */
      .game-container {
        position: relative;
        width: 600px;
        height: 480px;
        border: 4px solid #333;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        background-color: #0c0e1a;
      }

      /* Lưới 3x3 */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
      }

      /* TẦNG DƯỚI: Ô chứa mảnh ghép ảnh gốc */
      .cell {
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background-image: url("pacbo.jpg"); /* ĐƯỜNG DẪN ẢNH MỚI PÁC BÓ */
        background-size: 600px 480px;
        background-repeat: no-repeat;
        overflow: hidden;
      }

      /* Định vị tọa độ cắt ảnh cho từng ô từ 0 đến 8 */
      .cell[data-pos="0"] {
        background-position: 0px 0px;
      }
      .cell[data-pos="1"] {
        background-position: -200px 0px;
      }
      .cell[data-pos="2"] {
        background-position: -400px 0px;
      }

      .cell[data-pos="3"] {
        background-position: 0px -160px;
      }
      .cell[data-pos="4"] {
        background-position: -200px -160px;
      }
      .cell[data-pos="5"] {
        background-position: -400px -160px;
      }

      .cell[data-pos="6"] {
        background-position: 0px -320px;
      }
      .cell[data-pos="7"] {
        background-position: -200px -320px;
      }
      .cell[data-pos="8"] {
        background-position: -400px -320px;
      }

      /* TẦNG TRÊN: Lớp phủ màu đỏ đè lên ảnh kèm số */
      .red-cover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #d32f2f;
        color: white;
        font-size: 36px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s ease;
        user-select: none;
        z-index: 3;
      }

      .red-cover:hover {
        background-color: #b71c1c;
        transform: scale(0.98);
      }

      /* Hiệu ứng khi lớp đỏ bị lật mở */
      .red-cover.fade-out {
        opacity: 0;
        transform: scale(0.5) rotateY(90deg);
        pointer-events: none;
      }

      /* KHI Ô BỊ SAI: Đổi sang màu đen đặc che hoàn toàn ảnh nền và khóa click */
      .red-cover.black {
        background: #000000 !important;
        color: #ff4d4d !important;
        cursor: not-allowed !important;
        opacity: 1 !important;
        pointer-events: none !important;
      }

      /* ---- POPUP CÂU HỎI & THÔNG BÁO ---- */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .popup {
        background: white;
        color: #333;
        width: 90%;
        max-width: 550px;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        position: relative;
        transform: translateY(-20px);
        transition: transform 0.3s ease;
      }

      .overlay.active .popup {
        transform: translateY(0);
      }

      .popup-header {
        text-align: center;
        color: #d32f2f;
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 20px;
        border-bottom: 2px solid #f5f5f5;
        padding-bottom: 10px;
      }

      .popup-body {
        display: flex;
        gap: 20px;
      }

      .question-side {
        flex: 1.3;
      }

      .question-text {
        font-weight: 600;
        margin-bottom: 15px;
        line-height: 1.5;
        font-size: 15px;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .option-btn {
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #f9f9f9;
        text-align: left;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }

      .option-btn:hover {
        background: #f0f0f0;
      }

      .option-btn.selected {
        background: #e3f2fd;
        border-color: #2196f3;
        font-weight: bold;
      }

      .info-side {
        flex: 0.7;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .info-box {
        padding: 10px;
        border-radius: 6px;
        font-size: 13px;
      }
      .info-box strong {
        display: block;
        margin-bottom: 3px;
      }

      .box-score {
        background: #ffebee;
        color: #c62828;
      }
      .box-gift {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .box-penalty {
        background: #fff3e0;
        color: #ef6c00;
      }

      .popup-footer {
        margin-top: 20px;
        text-align: center;
      }

      .action-btn {
        background: #e65100;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: background 0.2s;
      }

      .action-btn:hover {
        background: #ef6c00;
      }

      /* Style dành riêng cho Popup Thông báo hệ thống */
      .custom-popup {
        text-align: center;
        max-width: 420px;
        padding: 30px 20px;
      }
      .popup-icon {
        font-size: 50px;
        margin-bottom: 15px;
      }
      .popup-custom-title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 12px;
      }
      .popup-custom-desc {
        font-size: 15px;
        color: #666;
        line-height: 1.5;
        margin-bottom: 25px;
      }
    </style>
  </head>
  <body>
    <h1>Mật Mã Đông Dương</h1>
    <p class="subtitle">
      Trả lời câu hỏi hoặc nhập từ khóa tên bức ảnh để lật mở toàn bộ!
    </p>
    <div style="margin-bottom: 20px">
      <button class="guess-btn" onclick="showFullImage()">Giải mã ngay</button>
    </div>

    <!-- <div class="guess-container">
      <input
        type="text"
        id="keyword-input"
        class="guess-input"
        placeholder="Nhập tên bức ảnh tại đây..."
        onkeypress="handleKeyPress(event)"
      />
      <button class="guess-btn" onclick="checkKeyword()">Giải mã ngay</button>
    </div> -->

    <div class="game-container">
      <div class="grid" id="grid"></div>
    </div>

    <div class="overlay" id="overlay">
      <div class="popup" id="popup-content"></div>
    </div>

    <script>
      // --- TÊN TỪ KHÓA ĐÁP ÁN ĐOÁN HÌNH 3 ---
      const CORRECT_KEYWORD = "BÁC HỒ Ở PÁC BÓ";
      const NEXT_PAGE = "index4.html"; // Cấu hình chuyển sang màn hình tiếp theo
      let isGameWon = false; // Theo dõi trạng thái hoàn thành màn chơi

      // --- NGÂN HÀNG CÂU HỎI MỚI (ẢNH 3) ---
      const anh3_PacBo = [
        // CÂU DỄ (3 câu gốc Nha Rồng + 1 câu nhận từ Tuyên Ngôn)
        {
          question: "Bác Hồ ra đi tìm đường cứu nước tại địa điểm nào?",
          answers: [
            "Bến Bạch Đằng",
            "Bến Nhà Rồng",
            "Bến Nghé",
            "Bến Chương Dương",
          ],
          correct: 1,
          score: 100,
          gift: "1 kẹo",
          penalty: "0%",
        },
        {
          question:
            "Nguyễn Ái Quốc tham gia tổ chức chính trị nào tại Pháp, đánh dấu bước chuyển từ chủ nghĩa yêu nước đến với chủ nghĩa cộng sản?",
          answers: [
            "Đánh dấu tại Đại hội Tua tham gia thành lập Đảng Cộng sản Pháp",
            "Đảng Xã hội Pháp",
            "Công đoàn Pháp",
            "Quốc dân Đảng Pháp",
          ],
          correct: 0,
          score: 100,
          gift: "Không có thưởng",
          penalty: "0%",
        },
        {
          question:
            "Nguyễn Tất Thành làm công việc gì trên tàu Amiral Latouche-Tréville khi bắt đầu hành trình ra đi tìm đường cứu nước?",
          answers: ["Thủy thủ", "Phụ bếp", "Thợ máy", "Nhân viên phục vụ"],
          correct: 1,
          score: 100,
          gift: "1 kẹo",
          penalty: "0%",
        },
        {
          // Nhận từ anh2_TuyenNgon lẻ ra
          question:
            "Thuật ngữ 'Tư tưởng Hồ Chí Minh' được xây dựng trên nền tảng triết học nào?",
          answers: [
            "Triết học phương Đông",
            "Triết học Hy Lạp cổ đại",
            "Chủ nghĩa Mác - Lênin",
            "Tư tưởng Nho giáo",
          ],
          correct: 2,
          score: 100,
          gift: "1 kẹo",
          penalty: "10%",
        },

        // CÂU TRUNG BÌNH (2 câu gốc Nha Rồng + 1 câu nhận từ Tuyên Ngôn)
        {
          question:
            "Câu nói: 'Dù phải đốt cháy cả dãy Trường Sơn cũng phải giành cho được độc lập' thể hiện điều gì trong tư tưởng của Hồ Chí Minh?",
          answers: [
            "Tinh thần quyết tâm giành độc lập dân tộc",
            "Tinh thần phát triển kinh tế",
            "Tinh thần đoàn kết quốc tế",
            "Tinh thần học tập khoa học kỹ thuật",
          ],
          correct: 0,
          score: 200,
          gift: "2 kẹo",
          penalty: "0%",
        },
        {
          question:
            "Khi nghiên cứu Cách mạng tư sản Mỹ (1776) và Cách mạng tư sản Pháp (1789), Hồ Chí Minh đánh giá các cuộc cách mạng đó như thế nào?",
          answers: [
            "Thắng lợi trọn vẹn",
            "Chưa đến nơi",
            "Không thành công",
            "Phản động",
          ],
          correct: 1,
          score: 200,
          gift: "khong có thưởng",
          penalty: "0%",
        },
        {
          // Nhận từ anh2_TuyenNgon lẻ ra
          question:
            "Trong lời mở đầu bản Tuyên ngôn Độc lập, Bác Hồ đã khẳng định: 'Tất cả mọi người đều sinh ra có quyền ...' - quyền gì?",
          answers: [
            "Tự do và mưu cầu hạnh phúc",
            "Sống và làm việc",
            "Bình đẳng và tự do",
            "Mưu cầu hạnh phúc",
          ],
          correct: 0,
          score: 200,
          gift: "Không có thưởng",
          penalty: "50%",
        },

        // CÂU KHÓ (1 câu gốc Nha Rồng + 1 câu nhận từ Tuyên Ngôn)
        {
          question:
            "Nguyễn Ái Quốc đã thay mặt tổ chức nào để gửi Bản yêu sách của nhân dân An Nam tới Hội nghị Vécxay?",
          answers: [
            "Hội những người Việt Nam yêu nước tại Pháp",
            "Hội Liên hiệp thuộc địa",
            "Hội Việt Nam Cách mạng Thanh niên",
            "Hội Liên hiệp các dân tộc bị áp bức",
          ],
          correct: 0,
          score: 300,
          gift: "1 bánh ",
          penalty: "10%",
        },
        {
          // Nhận từ anh2_TuyenNgon lẻ ra
          question:
            "Câu nói 'Nước Việt Nam có quyền hưởng tự do và độc lập, và sự thật đã thành một nước tự do, độc lập' được Bác Hồ trích dẫn từ văn kiện nào?",
          answers: [
            "Lời kêu gọi toàn quốc kháng chiến",
            "Tuyên ngôn Độc lập 2/9/1945",
            "Thư gửi Liên Hợp Quốc",
            "Báo cáo chính trị tại Đại hội Đảng lần II",
          ],
          correct: 1,
          score: 300,
          gift: "Nhóm sẽ có quyền 1 gợi ý nhỏ về bức ảnh",
          penalty: "0%",
        },
      ];
      const currentQuestionSet = [...anh3_PacBo];
      const wrongCells = new Set();

      const grid = document.getElementById("grid");
      const overlay = document.getElementById("overlay");
      const popupContent = document.getElementById("popup-content");
      let currentCellIndex = null;
      let currentCoverElement = null;
      let selectedOption = null;

      let questionTimer = null;
      let timeLeft = 15;

      // Khởi tạo lưới ô vuông
      for (let i = 1; i <= 9; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.setAttribute("data-pos", i - 1);

        const cover = document.createElement("div");
        cover.classList.add("red-cover");
        cover.innerText = i;

        cover.addEventListener("click", function (e) {
          if (wrongCells.has(i - 1)) {
            e.stopPropagation();
            return;
          }
          openQuestion(i - 1, cover);
        });

        cell.appendChild(cover);
        grid.appendChild(cell);
      }

      // --- BẬT POPUP THÔNG BÁO TỰ CHẾ (THAY ALERT) ---
      function showNotification(type, title, message) {
        popupContent.className = "popup custom-popup";

        let icon = "⚠️";
        let btnColor = "#e65100";
        let btnText = "Đóng";

        if (type === "success") {
          icon = "🎉";
          btnColor = "#4caf50";
          btnText = "Tiếp tục sang Ảnh 4 ➔"; // Thay đổi chữ trên nút bấm khi thắng cuộc
        }
        if (type === "error") {
          icon = "❌";
          btnColor = "#f44336";
        }

        popupContent.innerHTML = `
                <div class="popup-icon">${icon}</div>
                <div class="popup-custom-title" style="color: ${btnColor}">${title}</div>
                <div class="popup-custom-desc">${message}</div>
                <div class="popup-footer" style="margin-top: 0;">
                    <button class="action-btn" style="background: ${btnColor};" onclick="closePopup()">${btnText}</button>
                </div>
            `;
        overlay.classList.add("active");
      }

      // Mở popup câu hỏi
      function openQuestion(index, coverElement) {
        currentCellIndex = index;
        currentCoverElement = coverElement;
        selectedOption = null;

        const qData = currentQuestionSet[index];

        popupContent.className = "popup";
        popupContent.innerHTML = `
                <div class="popup-header" id="popup-title">Đang giải mã ô số ${parseInt(coverElement.innerText)}</div>
                  <div id="timer-display" style="margin-top:10px;color:#f44336;font-size:18px;">
                    ⏳ 15s
                </div>
                <div class="popup-body">
                    <div class="question-side">
                        <div class="question-text" id="question-text">${qData.question}</div>
                        <div class="options" id="options-container"></div>
                    </div>
                    <div class="info-side">
                        <div class="info-box box-score"><strong>❤️ Điểm:</strong><span>${qData.score}</span></div>
                        <div class="info-box box-gift"><strong>🎁 Thưởng:</strong><span>${qData.gift}</span></div>
                        <div class="info-box box-penalty"><strong>⚠️ Phạt:</strong><span>${qData.penalty}</span></div>
                    </div>
                </div>
                <div class="popup-footer">
                    <button class="action-btn" id="submit-btn" onclick="checkAnswer()">Xem Đáp Án</button>
                </div>
            `;

        const optionsContainer = document.getElementById("options-container");
        const labels = ["A", "B", "C", "D"];

        qData.answers.forEach((ans, idx) => {
          const btn = document.createElement("button");
          btn.classList.add("option-btn");
          btn.innerText = `${labels[idx]}. ${ans}`;
          btn.addEventListener("click", () => selectOption(btn, idx));
          optionsContainer.appendChild(btn);
        });

        overlay.classList.add("active");
        startQuestionTimer();
      }

      function startQuestionTimer() {
        clearInterval(questionTimer);

        timeLeft = 15;

        const timerDisplay = document.getElementById("timer-display");

        questionTimer = setInterval(() => {
          timeLeft--;

          if (timerDisplay) {
            timerDisplay.innerHTML = `⏳ ${timeLeft}s`;
          }

          if (timeLeft <= 0) {
            clearInterval(questionTimer);

            // showNotification(
            //   "error",
            //   "Hết giờ!",
            //   "Bạn đã hết 15 giây để trả lời câu hỏi này.",
            // );

            if (currentCoverElement) {
              currentCoverElement.classList.add("black");
              currentCoverElement.innerText = "✖";
              wrongCells.add(currentCellIndex);
            }
          }
        }, 1000);
      }

      function selectOption(btnElement, idx) {
        const allOptions = document.querySelectorAll(".option-btn");
        allOptions.forEach((opt) => opt.classList.remove("selected"));
        btnElement.classList.add("selected");
        selectedOption = idx;
      }

      function checkAnswer() {
        if (selectedOption === null) {
          showNotification(
            "warning",
            "Nhắc nhở",
            "Vui lòng chọn một đáp án trước khi xem kết quả!",
          );
          return;
        }

        const qData = currentQuestionSet[currentCellIndex];
        const allOptions = document.querySelectorAll(".option-btn");

        allOptions.forEach((opt) => (opt.style.pointerEvents = "none"));

        if (selectedOption === qData.correct) {
          allOptions[selectedOption].style.background = "#4caf50";
          allOptions[selectedOption].style.color = "white";
          allOptions[selectedOption].style.borderColor = "#4caf50";

          const submitBtn = document.getElementById("submit-btn");
          submitBtn.innerText = "Chính xác - Biến mất ô đỏ!";
          submitBtn.style.background = "#2e7d32";
          submitBtn.setAttribute("onclick", "revealCell()");
        } else {
          allOptions[selectedOption].style.background = "#f44336";
          allOptions[selectedOption].style.color = "white";
          allOptions[selectedOption].style.borderColor = "#f44336";

          allOptions[qData.correct].style.background = "#4caf50";
          allOptions[qData.correct].style.color = "white";
          allOptions[qData.correct].style.borderColor = "#4caf50";

          const submitBtn = document.getElementById("submit-btn");
          submitBtn.innerText = "Sai rồi! Đóng câu hỏi";
          submitBtn.style.background = "#555";
          submitBtn.setAttribute("onclick", "handleWrongAnswer()");
        }
      }

      function revealCell() {
        if (currentCoverElement) {
          currentCoverElement.classList.add("fade-out");
          setTimeout(() => {
            currentCoverElement.remove();
          }, 400);
        }
        closePopup();
      }

      function handleWrongAnswer() {
        if (currentCoverElement) {
          currentCoverElement.classList.add("black");
          currentCoverElement.innerText = "✖";
          wrongCells.add(currentCellIndex);
        }
        closePopup();
      }

      function closePopup() {
        clearInterval(questionTimer);
        overlay.classList.remove("active");
        // Nếu đã kích hoạt trạng thái thắng, nhấn đóng popup sẽ chuyển trang tự động
        if (isGameWon) {
          window.location.href = NEXT_PAGE;
        }
      }

      // --- XỬ LÝ ĐOÁN TỪ KHÓA TÊN BỨC ẢNH ---
      function removeVietnameseTones(str) {
        str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
        str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
        str = str.replace(/ì|í|ị|ỉ|ã/g, "i");
        str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
        str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
        str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
        str = str.replace(/đ/g, "d");
        str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
        str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|ễ/g, "E");
        str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
        str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
        str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
        str = str.replace(/Ỳ|Ý|Y|Ỷ|Ỹ/g, "Y");
        str = str.replace(/Đ/g, "D");
        str = str.replace(/[^a-zA-Z0-9 ]/g, "");
        return str;
      }
      function showFullImage() {
        isGameWon = true;

        const allCovers = document.querySelectorAll(".red-cover");

        allCovers.forEach((cov, index) => {
          setTimeout(() => {
            cov.style.pointerEvents = "none";
            cov.classList.remove("black");
            cov.classList.add("fade-out");

            setTimeout(() => {
              cov.remove();
            }, 400);
          }, index * 80);
        });

        // Sau 8 giây hiện popup
        setTimeout(() => {
          showNotification(
            "success",
            "Bác Hồ ở chiến khu Pác Bó!",
            "Đây là đáp án của bức tranh. Chuẩn bị chuyển sang vòng tiếp theo.",
          );
        }, 4000);

        // Tự động qua trang mới sau 10 giây
        setTimeout(() => {
          window.location.href = NEXT_PAGE;
        }, 10000);
      }
